name: Auto Harvest & Swiss Bridge

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: proxy-harvester-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp beautifulsoup4 curl_cffi

      - name: Run Xray Harvester
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u harvester.py

      - name: Configure Swiss 3X-UI Bridge
        env:
          XUI_URL: ${{ secrets.XUI_URL }}
          XUI_USER: ${{ secrets.XUI_USER }}
          XUI_PASS: ${{ secrets.XUI_PASS }}
        run: python -u xui_bridge.py

      - name: Push updated sub.txt
        run: |
          git config --global user.name "TheLastVPN Bot"
          git config --global user.email "bot@thelastvpn.local"
          git fetch origin main
          git reset --soft origin/main
          git add sub.txt active_slots_state.json sources.txt
          git diff --staged --quiet || git commit -m "chore: update Swiss bridge & proxy slots [skip ci]"
          git push origin main
